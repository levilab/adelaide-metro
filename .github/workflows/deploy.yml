name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT_ID: adelaide-metro-505702
  REGION: asia-east1
  SERVICE: adelaide-metro
  IMAGE: asia-east1-docker.pkg.dev/adelaide-metro-505702/cloud-run-source-deploy/adelaide-metro

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy Streamlit App to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"

      - name: Deploy GTFS Producer Service
        run: |
          gcloud run deploy ${{ env.SERVICE_PRODUCER }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --command python \
            --args "producer.py" \
            --no-allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --set-env-vars "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }},KAFKA_SECURITY_PROTOCOL=SASL_SSL,KAFKA_SASL_MECHANISM=SCRAM-SHA-256,KAFKA_SASL_USERNAME=${{ secrets.KAFKA_SASL_USERNAME }},KAFKA_SASL_PASSWORD=${{ secrets.KAFKA_SASL_PASSWORD }}"

      - name: Deploy consumer Cloud Run Job
        run: |
          gcloud run deploy ${{ env.SERVICE_CONSUMER }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --command python \
            --args "consumer.py" \
            --no-allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }},KAFKA_SECURITY_PROTOCOL=SASL_SSL,KAFKA_SASL_MECHANISM=SCRAM-SHA-256,KAFKA_SASL_USERNAME=${{ secrets.KAFKA_SASL_USERNAME }},KAFKA_SASL_PASSWORD=${{ secrets.KAFKA_SASL_PASSWORD }},CONSUMER_GROUP_PREFIX=gtfs-bq-loader"
