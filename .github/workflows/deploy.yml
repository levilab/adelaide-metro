name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_workers:
        description: "Start both realtime workers continuously (incurs ongoing costs)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT_ID: adelaide-metro-505702
  REGION: asia-east2
  SERVICE: adelaide-metro
  SERVICE_PRODUCER: gtfs-kafka-producer
  SERVICE_CONSUMER: gtfs-kafka-consumer
  IMAGE: asia-east2-docker.pkg.dev/adelaide-metro-505702/cloud-run-source-deploy/adelaide-metro

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Create ca.pem file
        run: echo "${{ secrets.APP_CA_PEM }}" > ca.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push with Caching gha
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Streamlit Dashboard App
      - name: Deploy Streamlit App to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},DASHBOARD_MODE=demo,BQ_MAX_QUERY_BYTES=104857600

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"

      # Producer (Worker Pool)
      - name: Deploy GTFS Producer Worker Pool
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_workers
        run: |
          gcloud run worker-pools deploy ${{ env.SERVICE_PRODUCER }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --scaling=1 \
            --command python \
            --args "streaming/producer.py" \
            --set-env-vars "KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }},KAFKA_SECURITY_PROTOCOL=SASL_SSL,KAFKA_SASL_MECHANISM=SCRAM-SHA-256,KAFKA_SASL_USERNAME=${{ secrets.KAFKA_SASL_USERNAME }},KAFKA_SASL_PASSWORD=${{ secrets.KAFKA_SASL_PASSWORD }}"

      # GTFS Consumer (Worker Pool)
      - name: Deploy GTFS Consumer Worker Pool
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_workers
        run: |
          gcloud run worker-pools deploy ${{ env.SERVICE_CONSUMER }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --scaling=1 \
            --command python \
            --args "streaming/consumer.py" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }},KAFKA_SECURITY_PROTOCOL=SASL_SSL,KAFKA_SASL_MECHANISM=SCRAM-SHA-256,KAFKA_SASL_USERNAME=${{ secrets.KAFKA_SASL_USERNAME }},KAFKA_SASL_PASSWORD=${{ secrets.KAFKA_SASL_PASSWORD }},CONSUMER_GROUP_PREFIX=gtfs-bq-loader"
