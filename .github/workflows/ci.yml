name: CI

on:
  pull_request:
    paths:
      - "bruin/**"
      - "streaming/**"
      - "terraform/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

jobs:
  bruin-validate:
    name: Bruin validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install Bruin
        run: |
          curl -LsSf https://raw.githubusercontent.com/bruin-data/bruin/main/install.sh | sh
          echo "/home/runner/.local/bin" >> "$GITHUB_PATH"

      # test fast bruin first, no GCP needed now
      - name: Validate Bruin pipeline
        run: bruin validate --fast bruin
  
  terraform-validate:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate
  
  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v