name: Batch and Realtime Transform Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'bruin/**'
      - '.github/workflows/batch.yml'
  schedule:
    # Run daily at 12:00 UTC (21:30 ACST / 22:30 ACDT).
    - cron: '00 12 * * *'
  workflow_dispatch:

env:
  PROJECT_ID: adelaide-metro-505702
  REGION: asia-east2
  BUCKET: adelaide-metro-505702-raw
  BATCH_IMAGE: asia-east2-docker.pkg.dev/adelaide-metro-505702/cloud-run-source-deploy/adelaide-metro-batch
  RT_JOB: rt-transform-job

jobs:
  batch:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker
        if: github.event_name != 'schedule'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule'
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push batch image
        if: github.event_name != 'schedule'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bruin/Dockerfile
          push: true
          tags: ${{ env.BATCH_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy batch Cloud Run Job
        if: github.event_name != 'schedule'
        run: |
          gcloud run jobs deploy batch-job \
            --image ${{ env.BATCH_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account bruin-pipeline@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},GCS_BUCKET=${{ env.BUCKET }} \
            --cpu 2 \
            --memory 4Gi \
            --max-retries 1 \
            --task-timeout 3600

      - name: Deploy realtime transform Cloud Run Job
        if: github.event_name != 'schedule'
        run: |
          gcloud run jobs deploy ${{ env.RT_JOB }} \
            --image ${{ env.BATCH_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --service-account ${{ secrets.WIF_SERVICE_ACCOUNT }} \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }} \
            --command bruin \
            --args run,assets/staging/stg_rt_trip_updates.sql,--downstream \
            --cpu 1 \
            --memory 1Gi \
            --max-retries 1 \
            --task-timeout 240

      - name: Run batch job
        run: |
          gcloud run jobs execute batch-job \
            --region ${{ env.REGION }} \
            --wait
